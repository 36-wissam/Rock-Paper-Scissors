<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissors</title>
</head>
<body>

    <main class="game">
        <!-- name header -->
        <div class="heder">
            <h1>Rock Paper Scissors</h1>
        </div>

        <!-- player vs computer score section -->
        <div class="statusChoice">
            <p id="playerChoice">PLAYER:</p>
            <p id="computerChoice">COMPUTER:</p>
        </div>

        <div class="paragraphtext">
            <p id="paragraphtext">CHOOSE YOUR WEAPON</p>
        </div>

        <div class="score">
            <p id="playerscore">YOUR SCORE: 0</p>
            <p><strong><em>VS</em></strong></p>
            <p id="compscore">COMPUTER SCORE: 0</p>
        </div>
        
        <!-- Rock Paper Scissors buttons -->
        <div class="gameBtns">
            <button id="rockBtn" value="rock"><img src="src/rock.png" alt="rock button"></button>
            <button id="paperBtn" value="paper"><img src="src/paper.png" alt="paper button"></button>
            <button id="scissorBtn" value="scissors"><img src="src/Scissors.png" alt="scissors button"></button>
        </div>

        <!-- for the hands logo -->
        <div class="logo-area">
            <img src="src/LOGO.png" alt="Game Logo">
        </div>
    </main>

    <!-- Footer -->
    <footer class="page-footer">
        <p>&copy; 2026 Wissam Mohammed. All rights reserved.</p>
        <a href="https://github.com/36-wissam" target="_blank" rel="noopener noreferrer" class="github-btn">
            <svg height="24" width="24" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            GitHub
        </a>
    </footer>

    <!-- Popup -->
    <div class="popup">
        <div class="overlay">
            <div class="popup-content">
                <h2>Game Over</h2>
                <p id="finalResult"></p>
                <button id="playAgainBtn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
